<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh Sách Đồ dùng</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 20px;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        table {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Chèn menu bên trái -->
<!--        <div th:replace="~{sidebar :: sidebar(currentPage='product-form')}" class="col-md-3 col-lg-2 d-md-block bg-light sidebar"></div>-->
        <div class="col-md-9 ml-sm-auto col-lg-10 px-4">
            <div class="row">
                <div class="col-12 text-center">
                    <h2 class="mb-4">Danh Sách Đồ dùng</h2>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
<!--                    <a href="/products/new" class="btn btn-success mb-3">Thêm Đồ dùng mới</a>-->
                    <table class="table table-hover table-bordered table-striped text-center" id="productTable">
                        <thead class="thead-dark">
                        <tr>
                            <th>Mã đồ dùng</th>
                            <th>Tên đồ dùng</th>
                            <th>Tuổi tối thiểu</th>
                            <th>Tuổi tối đa</th>
                            <th>Giá</th>
                            <th>Loại sản phẩm</th>
                            <th>Ảnh</th>
                        </tr>
                        </thead>
                        <tbody id="productBody">
                        <!-- Product rows will be dynamically added here -->
                        </tbody>
                    </table>

                    <!-- Phân trang -->
                    <nav aria-label="Page navigation">
                        <ul class="pagination justify-content-center" id="pagination">
                            <!-- Pagination buttons will be added dynamically with JavaScript -->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentPage = 0; // Biến để theo dõi trang hiện tại
    const pageSize = 5;  // Kích thước mỗi trang

    // Hàm tìm kiếm sản phẩm
    function searchProducts(page = 0) {
        const url = `/api/products?name=&age=8&minPrice=150&maxPrice=200&productTypeId=&status=&page=0&size=5`

        fetch(url)
            .then(response => response.json())
            .then(data => {
                const productBody = document.getElementById('productBody');
                const pagination = document.getElementById('pagination');
                productBody.innerHTML = ''; // Clear previous rows
                pagination.innerHTML = ''; // Clear previous pagination buttons

                // Hiển thị dữ liệu sản phẩm
                data.content.forEach(product => {
                    const row = `
                        <tr>
                            <td>${product.code}</td>
                            <td>${product.name}</td>
                            <td>${product.minAge}</td>
                            <td>${product.maxAge}</td>
                            <td>${product.price}</td>
                            <td>${product.typeId}</td>
                            <td><img src="http://localhost:8089/api/products/${product.id}/image" alt="Stationery Image" style="max-width: 150px; height: auto;" /></td>
                        </tr>
                    `;
                    productBody.innerHTML += row;
                });

                // Tạo nút phân trang
                const totalPages = data.totalPages; // Tổng số trang
                for (let i = 0; i < totalPages; i++) {
                    const li = document.createElement('li');
                    li.className = 'page-item';
                    li.innerHTML = `<a class="page-link" href="#" onclick="searchProducts(${i})">${i + 1}</a>`;
                    pagination.appendChild(li);
                }

                // Cập nhật trang hiện tại
                currentPage = page;
            })
            .catch(error => console.error('Error fetching products:', error));
    }
    // Hàm làm mới tất cả các trường nhập liệu

    // Gọi hàm tìm kiếm khi tải trang lần đầu
    document.addEventListener("DOMContentLoaded", function() {
            searchProducts();
        // }
    });
</script>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
